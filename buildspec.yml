version: 0.2

env:
  variables:
    ACCOUNT_ID: "719905538647"
    REGION: "ap-southeast-2"
    REPO_NAME: "fastapi-ecs"
    IMAGE_TAG: "latest"
    CLUSTER_NAME: "fastapi-clustertest"
    SERVICE_NAME: "fastapi-tasktest-service-5vgg0skz"

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

  build:
    commands:
      - cat main.py
      - docker build --no-cache -t $REPO_NAME:$IMAGE_TAG .
      - docker tag $REPO_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG
      - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment --region $REGION